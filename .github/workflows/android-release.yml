name: Android Package Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        default: "0.1.0"
      upload_release:
        description: "Upload the AAR to the matching GitHub Release"
        required: true
        type: boolean
        default: false
      publish_github_packages:
        description: "Publish the AAR to GitHub Packages"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: android-package-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_ABIS: "arm64-v8a armeabi-v7a x86_64"
  ANDROID_BUILD_TOOLS_VERSION: "36.1.0"
  ANDROID_CMAKE_VERSION: "3.31.6"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_CLEAN_AFTER_STAGE: "ON"
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  package:
    name: Build and publish Android AAR
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Print tool versions
        run: |
          java -version
          cmake --version
          "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake" --version
          ninja --version
          sdkmanager --version

      - name: Resolve release version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${VERSION}" >&2
            exit 64
          fi
          echo "PCLMOBILE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PCLMOBILE_RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Build package
        env:
          GH_TOKEN: ${{ github.token }}
          MAVEN_REPOSITORY_URL: https://maven.pkg.github.com/${{ github.repository }}
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=()
          if [[ "${{ github.event_name }}" == "release" || "${{ inputs.upload_release }}" == "true" ]]; then
            FLAGS+=(--upload-release)
          fi
          if [[ "${{ github.event_name }}" == "release" || "${{ inputs.publish_github_packages }}" == "true" ]]; then
            FLAGS+=(--publish-maven)
          fi
          ./scripts/package_android.sh "$PCLMOBILE_VERSION" "${FLAGS[@]}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: pclmobile-${{ env.PCLMOBILE_VERSION }}-release-aar
          path: AndroidWrapper/aar/pclmobile/build/outputs/aar/pclmobile-release.aar
          if-no-files-found: error
