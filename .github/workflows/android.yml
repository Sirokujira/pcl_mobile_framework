name: Android AAR

on:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "AndroidWrapper/aar/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "scripts/build_android.sh"
      - "scripts/package_android.sh"
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "AndroidWrapper/aar/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "scripts/build_android.sh"
      - "scripts/package_android.sh"
  workflow_dispatch:

concurrency:
  group: android-aar-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_BUILD_TOOLS_VERSION: "36.1.0"
  ANDROID_CMAKE_VERSION: "3.31.6"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_CLEAN_AFTER_STAGE: "ON"
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  aar:
    name: Build AAR (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86_64

    env:
      ANDROID_ABIS: ${{ matrix.abi }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Print tool versions
        run: |
          java -version
          cmake --version
          "${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake" --version
          ninja --version
          sdkmanager --version

      - name: Build native dependencies
        run: ./scripts/build_android.sh

      - name: Build and verify release AAR
        run: ./scripts/package_android.sh 0.1.0 --skip-native

      - name: Upload AAR
        uses: actions/upload-artifact@v7
        with:
          name: pclmobile-${{ matrix.abi }}-release-aar
          path: AndroidWrapper/aar/pclmobile/build/outputs/aar/pclmobile-release.aar
          if-no-files-found: error
