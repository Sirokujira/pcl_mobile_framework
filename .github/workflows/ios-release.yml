name: iOS Package Release

# Trigger flow:
#   1. Locally run `scripts/release.sh <version>` to patch Package.swift
#      and PCLMobile.podspec with the new SHA256/URL.
#   2. Commit the patched manifests and push.
#   3. Push the matching tag (`v<version>`) — this workflow takes over and:
#        - rebuilds the 3-slice PCLMobile.xcframework on a clean macOS runner
#        - creates/updates the GitHub Release for the tag
#        - uploads PCLMobile.xcframework.zip as a release asset
#        - (optionally) pushes the podspec to CocoaPods Trunk
#
# Manual re-runs and CocoaPods-only republish are available via the
# workflow_dispatch trigger.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (tag must already exist)"
        required: true
        default: "0.1.0"
      publish_cocoapods:
        description: "Also push to CocoaPods Trunk (needs COCOAPODS_TRUNK_TOKEN secret)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ios-package-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IOS_DEPLOYMENT_TARGET: "17.0"
  IOS_SLICES: "OS64 SIMULATORARM64 SIMULATOR64"

jobs:
  package:
    name: Build and publish iOS XCFramework
    runs-on: macos-15

    steps:
      - name: Checkout (tag commit)
        uses: actions/checkout@v6
        with:
          # The "patch checksum + move tag" step below needs master history
          # so it can fast-forward and commit there.
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve release version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${VERSION}" >&2
            exit 64
          fi
          echo "PCLMOBILE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PCLMOBILE_RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install build tools
        run: |
          brew install cmake ninja
          cmake --version
          ninja --version
          xcodebuild -version

      - name: Build PCLMobile.xcframework (3 slices)
        run: ./scripts/build_ios.sh

      - name: Compute checksums
        run: |
          ZIP=build/ios/xcframework/PCLMobile.xcframework.zip
          if [[ ! -f "$ZIP" ]]; then
            echo "ERROR: $ZIP not produced by build_ios.sh" >&2
            exit 1
          fi
          SHA256=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          ZIP_BYTES=$(stat -f '%z' "$ZIP")
          ZIP_MB=$(( ZIP_BYTES / 1024 / 1024 ))
          echo "Built XCFramework zip: ${ZIP_MB} MB, SHA256=${SHA256}"
          echo "PCLMOBILE_XCFW_SHA256=${SHA256}" >> "$GITHUB_ENV"
          echo "PCLMOBILE_XCFW_MB=${ZIP_MB}" >> "$GITHUB_ENV"

      - name: Patch Package.swift checksum + move tag if needed
        # The XCFramework SHA256 is only known after the CI build, so the
        # tag commit always has a placeholder/stale checksum. Patch
        # Package.swift on master, then force-update the tag to the new
        # commit so SPM consumers resolving `from: "X.Y.Z"` see the
        # matching checksum at the tag. The race window between the
        # original tag creation (by release-please) and this patch is a
        # few minutes — consumers won't have fetched the tag yet.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MANIFEST_SHA=$(grep -E 'let xcframeworkChecksum' Package.swift | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "$MANIFEST_SHA" == "$PCLMOBILE_XCFW_SHA256" ]]; then
            echo "Package.swift checksum already matches; skipping patch."
            exit 0
          fi
          echo "Patching Package.swift checksum: ${MANIFEST_SHA:-<empty>} → $PCLMOBILE_XCFW_SHA256"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Switch to master so the patch commit lands on the branch and
          # release-please sees it on the next pass. release-please skips
          # `chore:` commits when computing the next bump.
          git fetch origin master
          git checkout -B master origin/master

          python3 - <<PY
          import pathlib, re
          p = pathlib.Path("Package.swift")
          s = p.read_text()
          s = re.sub(
              r'(let xcframeworkChecksum\s*=\s*\n?\s*")[^"]*(")',
              r'\g<1>${PCLMOBILE_XCFW_SHA256}\g<2>',
              s, count=1)
          p.write_text(s)
          PY

          git add Package.swift
          git commit -m "chore: update XCFramework checksum for ${PCLMOBILE_RELEASE_TAG} [skip ci]"
          git push origin master

          # Move the tag to the patched commit so SPM consumers see the
          # correct checksum when they resolve the tag.
          git tag -fa "$PCLMOBILE_RELEASE_TAG" -m "PCLMobile $PCLMOBILE_VERSION"
          git push origin --force "$PCLMOBILE_RELEASE_TAG"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          PCLMobile ${PCLMOBILE_VERSION}

          Built on macos-15 / Xcode 16 / iOS deployment target ${IOS_DEPLOYMENT_TARGET}.

          XCFramework slices: ${IOS_SLICES}
          XCFramework zip:    ${PCLMOBILE_XCFW_MB} MB
          SHA256:             \`${PCLMOBILE_XCFW_SHA256}\`

          Distribution channels:
          - Swift Package Manager → \`Package.swift\` (binary target)
          - CocoaPods             → \`PCLMobile.podspec\`
          EOF

          if ! gh release view "$PCLMOBILE_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$PCLMOBILE_RELEASE_TAG" \
              --title "PCLMobile $PCLMOBILE_VERSION" \
              --notes-file "$NOTES_FILE"
          fi
          gh release upload "$PCLMOBILE_RELEASE_TAG" \
            build/ios/xcframework/PCLMobile.xcframework.zip \
            --clobber

      - name: Publish to CocoaPods Trunk (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_cocoapods == true
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [[ -z "${COCOAPODS_TRUNK_TOKEN:-}" ]]; then
            echo "::warning::COCOAPODS_TRUNK_TOKEN secret not set; skipping pod trunk push."
            exit 0
          fi
          pod trunk push iOSWrapper/PCLMobile.podspec --allow-warnings

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: pclmobile-${{ env.PCLMOBILE_VERSION }}-xcframework
          path: |
            build/ios/xcframework/PCLMobile.xcframework
            build/ios/xcframework/PCLMobile.xcframework.zip
          if-no-files-found: error
          retention-days: 90
