name: Android Maven Central Release

# Publishes the pclmobile AAR to Sonatype Maven Central (legacy OSSRH endpoint
# by default). The workflow is intentionally manual-only — Maven Central
# releases are one-way and rate-limited, so we never want them firing from
# a stray tag push.
#
# Required GitHub secrets:
#   OSSRH_USERNAME       — Sonatype "user token name"
#   OSSRH_PASSWORD       — Sonatype "user token password"
#   SIGNING_KEY          — ASCII-armoured GPG private key (`gpg --armor --export-secret-keys <id>`)
#   SIGNING_PASSWORD     — Passphrase for the GPG key
#   SIGNING_KEY_ID       — Optional last 8 chars of the GPG fingerprint
#
# See docs/package_publishing.md for the full setup guide (Sonatype account
# creation, namespace verification, GPG key generation).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      maven_repository_url:
        description: "Maven endpoint. Default is Sonatype OSSRH staging."
        required: true
        default: "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
      dry_run:
        description: "Dry-run: build + sign + publish to local repo only, no upload."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-maven-central
  cancel-in-progress: false

env:
  ANDROID_ABIS: "arm64-v8a armeabi-v7a x86_64"
  ANDROID_BUILD_TOOLS_VERSION: "36.1.0"
  ANDROID_CMAKE_VERSION: "3.31.6"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_CLEAN_AFTER_STAGE: "ON"
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  publish:
    name: Publish pclmobile to Maven Central
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Resolve release version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${VERSION}" >&2
            exit 64
          fi
          echo "PCLMOBILE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build PCL native dependencies
        run: ./scripts/build_android.sh

      - name: Validate required secrets
        if: inputs.dry_run == false
        run: |
          missing=()
          [[ -z "${{ secrets.OSSRH_USERNAME }}" ]]     && missing+=(OSSRH_USERNAME)
          [[ -z "${{ secrets.OSSRH_PASSWORD }}" ]]     && missing+=(OSSRH_PASSWORD)
          [[ -z "${{ secrets.SIGNING_KEY }}" ]]        && missing+=(SIGNING_KEY)
          [[ -z "${{ secrets.SIGNING_PASSWORD }}" ]]   && missing+=(SIGNING_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Required secrets are not set: ${missing[*]}"
            echo "See docs/package_publishing.md for setup steps."
            exit 1
          fi

      - name: Publish to local repository (dry-run)
        if: inputs.dry_run == true
        working-directory: AndroidWrapper/aar
        env:
          PCLMOBILE_VERSION: ${{ env.PCLMOBILE_VERSION }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        run: |
          ./gradlew :pclmobile:publishReleasePublicationToLocalReleaseRepository
          echo
          echo "=== Local repo contents ==="
          find pclmobile/build/repo -type f | sort

      - name: Publish to Maven Central staging
        if: inputs.dry_run == false
        working-directory: AndroidWrapper/aar
        env:
          PCLMOBILE_VERSION: ${{ env.PCLMOBILE_VERSION }}
          MAVEN_REPOSITORY_URL: ${{ inputs.maven_repository_url }}
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        run: |
          ./gradlew :pclmobile:publishReleasePublicationToRemoteRepository --info
          echo
          echo "::notice::Uploaded to ${MAVEN_REPOSITORY_URL}"
          echo "::notice::Sonatype OSSRH: log in to https://s01.oss.sonatype.org/ to close + release the staging repo (or use the Central Portal UI for Portal-published namespaces)."

      - name: Upload local-repo artifacts (dry-run only)
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v7
        with:
          name: pclmobile-${{ env.PCLMOBILE_VERSION }}-maven-bundle
          path: AndroidWrapper/aar/pclmobile/build/repo
          if-no-files-found: error
          retention-days: 30
