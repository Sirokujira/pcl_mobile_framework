name: pcl_mobile_flutter
description: Flutter plugin sample for calling pclMobile on Android and iOS.
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.sirokujira.pclmobile.flutter
        pluginClass: PclMobilePlugin
      ios:
        pluginClass: SwiftPclMobilePlugin
