# Project-wide Gradle settings.
# Documentation: https://docs.gradle.org/current/userguide/build_environment.html

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX migration flags (required by AGP 8.x).
android.useAndroidX=true
android.enableJetifier=false

# Kotlin code style.
kotlin.code.style=official

# Disable non-essential feature defaults to keep build fast.
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
