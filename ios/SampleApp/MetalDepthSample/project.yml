name: MetalDepthSample
options:
  bundleIdPrefix: io.github.sirokujira
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE

targets:
  MetalDepthSample:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MetalDepthSample
    info:
      path: MetalDepthSample/Info.plist
      properties:
        NSCameraUsageDescription: "ARKit uses the camera to collect scene depth data for Metal point cloud rendering."
        UIRequiredDeviceCapabilities:
          - arm64
          - arkit
          - iphone-lidar
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sirokujira.MetalDepthSample
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: MetalDepthSample/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"

schemes:
  MetalDepthSample:
    build:
      targets:
        MetalDepthSample: all
    run:
      config: Debug
    archive:
      config: Release
